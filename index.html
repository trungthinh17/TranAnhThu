    <style>
      body {

    <title>Tặng em — Trần Anh Thư</title>
    <style>
      :root {
        --bg1: #fff0f6;
        --bg2: #ffe6f0;
        --accent: #ff69b4;
        --accent-2: #ffb6c1;
        --ribbon: #ff99cc;
        --ribbon-dark: #ff5ca0;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: "Comic Sans MS", cursive, sans-serif;
      }
      body {
        background: radial-gradient(
            900px 500px at 10% 20%,
            rgba(255, 105, 180, 0.08),
            transparent
          ),
          radial-gradient(
            800px 400px at 90% 80%,
            rgba(255, 182, 193, 0.05),
            transparent
          ),
          linear-gradient(180deg, var(--bg1), var(--bg2));
        display: flex;
        align-items: center;
        justify-content: center;
        color: #d63384;
        overflow: hidden;
        padding: 32px;
      }
      .card {
        width: 900px;
        max-width: 100%;
        background: rgba(255, 255, 255, 0.5);
        border-radius: 20px;
        padding: 36px;
        box-shadow: 0 10px 40px rgba(255, 105, 180, 0.3);
        backdrop-filter: blur(8px);
        display: grid;
        grid-template-columns: 1fr 380px;
        gap: 24px;
        /* align-items: center; */
        border: 2px solid var(--accent);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 30px;
        letter-spacing: 0.2px;
        color: #ff1493;
        text-shadow: 0 0 6px #fff;
      }
      p.lead {
        margin: 0 0 18px;
        color: #c2185b;
      }
      .message {
        margin-top: 10px;
        font-size: 17px;
        color: #ff4081;
        font-style: italic;
        text-shadow: 0 0 6px #fff;
        animation: glowText 3s ease-in-out infinite alternate;
      }

      @keyframes glowText {
        0% {
          text-shadow: 0 0 6px #fff, 0 0 10px #ff69b4, 0 0 20px #ff1493;
          transform: scale(1);
        }
        50% {
          text-shadow: 0 0 12px #fff, 0 0 22px #ff69b4, 0 0 35px #ff1493;
          transform: scale(1.02);
        }
        100% {
          text-shadow: 0 0 6px #fff, 0 0 10px #ff69b4, 0 0 20px #ff1493;
          transform: scale(1);
        }
      }

      button {
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        margin-top: -30px; /* số âm nghĩa là đẩy lên */
        border: 0;
        padding: 12px 16px;
        border-radius: 12px;
        color: white;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 6px 18px rgba(255, 92, 138, 0.25);
      }
      button.ghost {
        background: transparent;
        border: 2px solid var(--accent);
        color: var(--accent);
      }

      .stage {
        position: relative;
        height: 420px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .heart {
        --c: red;
        width: 200px;
        position: absolute;
        right: 70px;
        top: 88px;
        aspect-ratio: 1;
        background: radial-gradient(circle at 60% 65%, var(--c) 64%, #0000 65%)
            top left/50% 50%,
          radial-gradient(circle at 40% 65%, var(--c) 64%, #0000 65%) top
            right/50% 50.1%,
          conic-gradient(from -45deg at 50% 85.5%, var(--c) 90deg, #0000 0)
            bottom/100% 50.1%;
        background-repeat: no-repeat;
        animation: blink-medium 3s ease-in-out infinite alternate;
      }

      @keyframes blink-medium {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }

      /* @keyframes strong-shake {
        0%,
        100% {
          transform: rotate(0deg);
        }
        10% {
          transform: rotate(10deg);
        }
        20% {
          transform: rotate(-10deg);
        }
        30% {
          transform: rotate(12deg);
        }
        40% {
          transform: rotate(-12deg);
        }
        50% {
          transform: rotate(8deg);
        }
        60% {
          transform: rotate(-8deg);
        }
        70% {
          transform: rotate(6deg);
        }
        80% {
          transform: rotate(-6deg);
        }
        90% {
          transform: rotate(4deg);
        }
      } */

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-content: center;
        place-items: center;
        grid-auto-flow: column;
        gap: 15px;
      }

      .float-heart {
        position: absolute;
        width: 22px;
        height: 22px;
        pointer-events: none;
        transform: rotate(-45deg);
      }
      .float-heart .h {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: var(--accent);
      }
      .float-heart .h::before,
      .float-heart .h::after {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: inherit;
      }
      .float-heart .h::before {
        top: -50%;
      }
      .float-heart .h::after {
        left: 50%;
      }

      @keyframes bgPulse {
        0%,
        100% {
          background-color: rgba(255, 192, 203, 0.2);
        }
        50% {
          background-color: rgba(255, 182, 193, 0.6);
        }
      }

      /* electron elements are absolutely positioned inside .atom */
      .electron {
        position: absolute;
        right: 200px;
        top: 250px;
        transform-style: preserve-3d;
        will-change: transform, opacity;
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: var(--electron-size);
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      }

      /* optional faint orbit rings for visualization */
      .orbit-ring {
        position: absolute;
        right: 200px;
        top: 250px;
        /* left: 50%;
        top: 50%; */
        transform: translate(-50%, -50%);
        border-radius: 50%;
        border: 1px dashed rgba(255, 255, 255, 0.06);
        pointer-events: none;
        mix-blend-mode: screen;
        filter: blur(0.6px) brightness(1.1);
      }

      /* subtle glow background */
      .glow {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse at center,
          rgba(255, 107, 154, 0.02) 0%,
          transparent 30%
        );
      }

      /* small responsive tweak */
      @media (max-width: 520px) {
        .nucleus {
          width: 60px;
          height: 60px;
          font-size: 28px;
        }
        :root {
          --electron-size: 18px;
        }
      }
      #kitty {
        position: absolute;
        top: 70%; /* vị trí dọc */
        left: 28%; /* vị trí ngang */
        transform: translate(-50%, -50%);
      }
      #playBtn {
        position: absolute;
        top: calc(60% + 90px); /* đẩy nút lên trên 60px so với Kitty */
        left: 13%;
        transform: translate(-50%, -50%);
      }
    </style>
  </head>
  <body data-new-gr-c-s-check-loaded="14.1123.0" data-gr-ext-installed="">
    <audio id="bgMusic" src="audio1.mp3"></audio>

    <div class="card">
      <div>
        <h3 id="Day"></h3>
        <br />
        <h1>Tặng em — Trần Anh Thư 💕</h1>
        <p class="lead">
          <i>Hãy nhấn <b>Gửi trái tim</b> để cảm nhận về anh</i> 💖
        </p>
        <br />
        <p class="message">
          Chúc em 20/10 thật vui vẻ, luôn xinh đẹp, FTU/HNUE thẳng

        </p>

        <button id="playBtn">Gửi trái tim 💖</button>
        <img id="kitty" src="giphy.gif" width="10%" />

        <!--<button id="replayBtn" class="ghost">Phát lại</button>-->
        <div class="heart" style="width: 300px; --c: #ffced2"></div>

        <div class="atom" id="atom">
          <div class="glow"></div>

          <!-- orbit rings (visual only) -->
          <div

          <div

      <div class="stage">
        <div class="heart-shape" id="mainHeart"></div>
        <div id="kittyContainer"></div>
        <div class="ribbon" style="top: 10%; left: 60%"></div>
        <div class="ribbon" style="bottom: 15%; right: 20%"></div>
        <div id="floatContainer"></div>
      </div>
    </div>

    <script>
      (function () {
        // --- Cấu hình: ngày thành lập (năm, thángIndex(0-11), ngày)
        // ví dụ: 1/2/2025 -> monthIndex = 1 (tháng 2)
        const startYear = 2025,
          startMonthIndex = 6,
          startDay = 7;

        function daysSinceInclusive(y, mIndex, d) {
          // tạo timestamp UTC cho ngày bắt đầu và ngày hôm nay (chỉ phần ngày)
          const startUTC = Date.UTC(y, mIndex, d);
          const now = new Date();
          const todayUTC = Date.UTC(
            now.getFullYear(),
            now.getMonth(),
            now.getDate()
          );
          const msPerDay = 24 * 60 * 60 * 1000;
          const diff = Math.floor((todayUTC - startUTC) / msPerDay);
          // diff = 0 nếu là cùng ngày; +1 để tính bao gồm ngày bắt đầu
          return diff < 0 ? diff : diff + 1;
        }

        const days = daysSinceInclusive(startYear, startMonthIndex, startDay);
        const el = document.getElementById("Day");

        el.textContent = `Từ khi quen em đã ${days} ngày trôi qua.`;
      })();
      //--------------------------------------------------------------------------

      const atom = document.getElementById("atom");

      /* configuration: tweak or add electrons here */
      const electrons = [
        {
          icon: "💕",
          radiusX: 160,
          radiusY: 80,
          speed: 36,
          phase: 0,
          tilt: 20,
          size: 20,
        },
        {
          icon: "💓",
          radiusX: 120,
          radiusY: 60,
          speed: -48,
          phase: 90,
          tilt: 50,
          size: 18,
        },
        {
          icon: "💞",
          radiusX: 200,
          radiusY: 100,
          speed: 24,
          phase: 200,
          tilt: -10,
          size: 16,
        },
        // add more if you want
      ];

      /* create DOM elements for electrons */
      const elems = electrons.map((cfg) => {
        const el = document.createElement("div");
        el.className = "electron";
        el.textContent = cfg.icon;
        el.style.fontSize = cfg.size + "px";
        atom.appendChild(el);
        return { cfg, el };
      });

      /* animation state */
      let startTime = null;

      /* center in pixels relative to atom bounding box */
      function getCenter() {
        const rect = atom.getBoundingClientRect();
        return { cx: rect.width / 2, cy: rect.height / 2 };
      }

      /* convert degrees to radians */
      const D2R = Math.PI / 180;

      /* animation loop */
      function animate(t) {
        if (!startTime) startTime = t;
        const elapsed = (t - startTime) / 1000; // seconds
        const center = getCenter();

        elems.forEach(({ cfg, el }, i) => {
          // angle in degrees = phase + speed * elapsed
          const angleDeg = (cfg.phase + cfg.speed * elapsed) % 360;
          const a = angleDeg * D2R;

          // parametric ellipse (x along major axis, y along minor axis)
          const x = cfg.radiusX * Math.cos(a);
          const y = cfg.radiusY * Math.sin(a);

          // tilt: rotate the ellipse around x-axis to get 3D effect
          // simple projection: scale y by cos(tilt) and add a small z-based scale
          const tiltRad = cfg.tilt * D2R;
          const yTilted = y * Math.cos(tiltRad);
          const z = y * Math.sin(tiltRad); // use z to adjust scale/opacity

          // screen coords
          const left = center.cx + x;
          const top = center.cy + yTilted;

          // perspective scale: electrons closer (z positive) appear slightly bigger
          const scale = 1 + z / (cfg.radiusY * 6); // tuned divisor for subtle effect

          // depth-based opacity
          const opacity =
            0.6 + Math.min(0.4, (z + cfg.radiusY) / (cfg.radiusY * 2));

          // apply transforms
          el.style.transform = `translate3d(${left - center.cx}px, ${
            top - center.cy
          }px, 0) translate(-50%,-50%) scale(${scale.toFixed(3)}) rotateZ(${
            angleDeg * 0.2
          }deg)`;
          el.style.opacity = opacity.toFixed(3);
          el.style.zIndex = Math.round(100 + z); // ensure correct stacking
        });

        requestAnimationFrame(animate);
      }

      /* start animation */
      requestAnimationFrame(animate);

      /* responsive: reposition orbit rings to fit atom size */
      function adjustRings() {
        const rect = atom.getBoundingClientRect();
        // optionally scale ring sizes relative to atom box
        const r0 = atom.querySelector("#ring-0");
        const r1 = atom.querySelector("#ring-1");
        const r2 = atom.querySelector("#ring-2");
        if (r0) {
          r0.style.width = Math.min(240, rect.width * 0.45) + "px";
          r0.style.height = Math.min(240, rect.width * 0.45) + "px";
        }
        if (r1) {
          r1.style.width = Math.min(320, rect.width * 0.65) + "px";
          r1.style.height = Math.min(180, rect.width * 0.35) + "px";
        }
        if (r2) {
          r2.style.width = Math.min(380, rect.width * 0.9) + "px";
          r2.style.height = Math.min(380, rect.width * 0.9) + "px";
        }
      }
      window.addEventListener("resize", adjustRings);
      adjustRings();

      //--------------------------------------------------------------------------

      const playBtn = document.getElementById("playBtn");
      //const replayBtn = document.getElementById("replayBtn");
      const floatContainer = document.getElementById("floatContainer");
      //const kittyContainer = document.getElementById("kittyContainer");
      const bgMusic = document.getElementById("bgMusic");
      //const heart = document.getElementById("mainHeart");
      let check = false;

      function rand(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }
      //---------------------------------------------------------------------------
      const heartEmojis = ["💖", "💕", "💓", "💞", "💝"];

      function createFloatHeart() {
        const el = document.createElement("div");
        el.className = "float-heart";
        el.textContent = heartEmojis[rand(0, heartEmojis.length - 1)];

        el.style.left = rand(20, 80) + "%";
        el.style.top = "80%";

        const size = rand(28, 47);
        el.style.fontSize = size + "px";

        floatContainer.appendChild(el);
        const duration = rand(3000, 5000);
        el.animate(
          [
            { transform: "translateY(0)", opacity: 1 },
            { transform: `translateY(-${rand(250, 400)}px)`, opacity: 0 },
          ],
          { duration, easing: "ease-out", iterations: 1 }
        );
        setTimeout(() => el.remove(), duration);

        // el.className = "float-heart";
        // const h = document.createElement("div");
        // h.className = "h";
        // el.appendChild(h);
        // el.style.left = rand(20, 80) + "%";
        // el.style.top = "80%";
        // floatContainer.appendChild(el);
        // const size = rand(15, 30);
        // el.style.swidth = size + "px";
        // el.style.height = size + "px";
        // const duration = rand(3000, 5000);
        // el.animate(
        //   [
        //     { transform: "translateY(0)", opacity: 1 },
        //     { transform: `translateY(-${rand(250, 400)}px)`, opacity: 0 },
        //   ],
        //   { duration, easing: "ease-out", iterations: 1 }
        // );
        // setTimeout(() => el.remove(), duration);
      }
      // function spawnGroup() {
      //   const count = rand(3, 5);
      //   for (let i = 0; i < count; i++) {
      //     setTimeout(createFloatHeart, i * 100);
      //   }
      // }

      const rate = document.getElementById("rate");
      const rateVal = document.getElementById("rateVal");

      let ticker = null;
      function start(autoRate) {
        if (ticker) return;
        ticker = setInterval(createFloatHeart, autoRate);
      }
      function stop() {
        if (ticker) {
          clearInterval(ticker);
          ticker = null;
        }
      }

      playBtn.addEventListener("click", () => {
        if (!check) {
          bgMusic.play();
          check = true;
        }
        createFloatHeart();
      });
      rate.addEventListener("input", () => {
        rateVal.textContent = rate.value + " ms";
        if (ticker) {
          stop();
          start(parseInt(rate.value, 10));
        }
      });

      for (let i = 0; i < 6; i++) {
        setTimeout(createFloatHeart, i * 220);
      }
